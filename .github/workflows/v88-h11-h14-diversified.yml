name: V88 H11-H14 Diversified Four-Class Wave

on:
  push:
    branches: ["chatgpt/v88-h11-h14-4class-20260929"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validation-screen:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        hypothesis: ["H11","H12","H13","H14"]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          name: v88-h3-data
          path: scratch/chatgpt_v88/h11_h14_data
          repository: ${{ github.repository }}
          run-id: 36508270456
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check --no-input numpy pandas
      - name: Execute one genuinely new idea from an independent strategy class
        env:
          HYPOTHESIS: ${{ matrix.hypothesis }}
        run: python scratch/chatgpt_v88/h11_h14/run_h11_h14.py
      - uses: actions/upload-artifact@v4
        with:
          name: v88-h11-h14-validation-${{ matrix.hypothesis }}
          path: scratch/chatgpt_v88/h11_h14_data/**/results/${{ matrix.hypothesis }}_VALIDATION.json
          if-no-files-found: error
          retention-days: 1

  select-config:
    needs: validation-screen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: v88-h11-h14-validation-*
          path: validation-results
          merge-multiple: false
      - name: Guardian-gated validation-only lock
        run: |
          python - <<'PY'
          import glob,json,sys
          files=sorted(set(glob.glob("validation-results/**/H*_VALIDATION.json",recursive=True)))
          rows=[]
          for fn in files:
              try:
                  with open(fn) as f: rows.append(json.load(f))
              except Exception as e:
                  raise SystemExit(f"INVALID_VALIDATION_ARTIFACT:{fn}:{e}")
          if len(rows)!=4:
              raise SystemExit(f"EXPECTED_4_VALIDATION_ARTIFACTS_GOT_{len(rows)}")
          classes={r["strategy_class"] for r in rows}
          if len(classes)<3:
              raise SystemExit("GUARDIAN_CLASS_DIVERSITY_FAILURE")
          eligible=[r for r in rows if r["validation"]["n"]>=100 and r["validation"]["mean"]>0 and r["validation"]["PF"]>1]
          summary={"all_validation":[{"hypothesis_id":r["hypothesis_id"],"strategy_class":r["strategy_class"],"validation":r["validation"]} for r in rows],"classes":sorted(classes),"oos_seen":False}
          if not eligible:
              summary["family_status"]="H11_H14_NO_VALIDATION_ELIGIBLE_CONFIGURATION"
              json.dump(summary,open("H11_H14_CONFIG_LOCK.json","w"),indent=2)
              raise SystemExit("NO_H11_H14_VALIDATION_ELIGIBLE")
          eligible.sort(key=lambda r:(r["validation"]["Sharpe"],r["validation"]["mean"],r["validation"]["PF"]),reverse=True)
          w=eligible[0]
          summary.update({"family_status":"CONFIRMATORY_HYPOTHESIS_LOCKED","selected_hypothesis":w["hypothesis_id"],"selected_strategy_class":w["strategy_class"],"selected_validation":w["validation"],"selection_rule":"highest fresh-validation Sharpe among preregistered guardian-approved hypotheses with n>=100, positive mean, PF>1"})
          json.dump(summary,open("H11_H14_CONFIG_LOCK.json","w"),indent=2)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v88-h11-h14-config-lock
          path: H11_H14_CONFIG_LOCK.json
          if-no-files-found: error
          retention-days: 1

  confirmatory:
    needs: select-config
    if: ${{ success() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          name: v88-h3-data
          path: scratch/chatgpt_v88/h11_h14_data
          repository: ${{ github.repository }}
          run-id: 36508270456
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          name: v88-h11-h14-config-lock
          path: .
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check --no-input numpy pandas
      - name: Run one locked hypothesis on untouched OOS and holdout
        run: |
          python - <<'PY'
          import json,os,subprocess
          cfg=json.load(open("H11_H14_CONFIG_LOCK.json"))
          if cfg.get("family_status")!="CONFIRMATORY_HYPOTHESIS_LOCKED":
              raise SystemExit("NO_CONFIRMATORY_LOCK")
          os.environ["HYPOTHESIS"]=cfg["selected_hypothesis"]
          subprocess.run(["python","scratch/chatgpt_v88/h11_h14/run_h11_h14_confirm.py"],check=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v88-h11-h14-confirmatory
          path: scratch/chatgpt_v88/h11_h14_data/**/results/H11_H14_CONFIRMATORY.json
          if-no-files-found: error
          retention-days: 1
