name: V88 H16-H19 Fresh 2023 Four-Class Wave

on:
  pull_request:
    branches: [main]
    paths:
      - "research-results/edge-search/V88_CYCLE3_H16_H19_MANIFEST.json"

permissions:
  contents: read

jobs:
  acquire-data:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Deterministic V1.12.2 execution-closure preflight
        env:
          V88_PROMPT_VERSION: "1.12.2"
          V88_PROMPT_SHA: "01d55dbe7c790ae91c8424f535e5ac68d52b9dea"
        run: python scratch/chatgpt_v88/h16_h19/release_preflight.py
      - uses: actions/upload-artifact@v4
        with:
          name: v88-h16-h19-v1-12-2-preflight
          path: research-results/edge-search/V88_CYCLE3_H16_H19_PREFLIGHT_1_12_2.json
          if-no-files-found: error
          retention-days: 7
      - run: python -m pip install --disable-pip-version-check --no-input pandas
      - name: Acquire fresh 2023 Binance 15m klines and funding
        run: python scratch/chatgpt_v88/h16_h19/acquire_2023.py
      - uses: actions/upload-artifact@v4
        with:
          name: v88-h16-h19-2023-data
          path: scratch/chatgpt_v88/h16_h19_data
          if-no-files-found: error
          retention-days: 1

  validation:
    needs: acquire-data
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        hypothesis: ["H16","H17","H18","H19"]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          name: v88-h16-h19-2023-data
          path: scratch/chatgpt_v88/h16_h19_data
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check --no-input numpy pandas
      - name: Execute new idea from distinct strategy class
        env:
          HYPOTHESIS: ${{ matrix.hypothesis }}
          V88_PROMPT_VERSION: "1.12.2"
          V88_PROMPT_SHA: "01d55dbe7c790ae91c8424f535e5ac68d52b9dea"
        run: python scratch/chatgpt_v88/h16_h19/run_h16_h19.py
      - uses: actions/upload-artifact@v4
        with:
          name: v88-h16-h19-validation-${{ matrix.hypothesis }}
          path: scratch/chatgpt_v88/h16_h19_data/**/results/${{ matrix.hypothesis }}_VALIDATION.json
          if-no-files-found: error
          retention-days: 1

  select-config:
    needs: validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: v88-h16-h19-validation-*
          path: validation-results
          merge-multiple: false
      - name: Guardian validation-only lock
        run: |
          python - <<'PY'
          import glob,json
          files=sorted(glob.glob("validation-results/**/H*_VALIDATION.json",recursive=True))
          rows=[json.load(open(fn)) for fn in files]
          if len(rows)!=4: raise SystemExit(f"EXPECTED_4_GOT_{len(rows)}")
          if any(r.get("prompt_version")!="1.12.2" or r.get("prompt_sha")!="01d55dbe7c790ae91c8424f535e5ac68d52b9dea" for r in rows):
              raise SystemExit("PROMPT_RELEASE_LINEAGE_MISMATCH")
          if len({r["strategy_class"] for r in rows})<3: raise SystemExit("GUARDIAN_CLASS_DIVERSITY_FAILURE")
          eligible=[r for r in rows if r["validation"]["n"]>=100 and r["validation"]["mean"]>0 and r["validation"]["PF"]>1]
          summary={"all_validation":[{"hypothesis_id":r["hypothesis_id"],"strategy_class":r["strategy_class"],"validation":r["validation"]} for r in rows],"classes":sorted({r["strategy_class"] for r in rows}),"oos_seen":False}
          if not eligible:
              summary["family_status"]="H16_H19_NO_VALIDATION_ELIGIBLE_CONFIGURATION"
              json.dump(summary,open("H16_H19_CONFIG_LOCK.json","w"),indent=2)
              raise SystemExit("NO_H16_H19_VALIDATION_ELIGIBLE")
          eligible.sort(key=lambda r:(r["validation"]["Sharpe"],r["validation"]["mean"],r["validation"]["PF"]),reverse=True)
          w=eligible[0]; summary.update({"family_status":"CONFIRMATORY_HYPOTHESIS_LOCKED","selected_hypothesis":w["hypothesis_id"],"selected_validation":w["validation"],"selected_strategy_class":w["strategy_class"]})
          json.dump(summary,open("H16_H19_CONFIG_LOCK.json","w"),indent=2)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v88-h16-h19-config-lock
          path: H16_H19_CONFIG_LOCK.json
          if-no-files-found: error
          retention-days: 1

  confirmatory:
    needs: select-config
    if: ${{ success() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          name: v88-h16-h19-2023-data
          path: scratch/chatgpt_v88/h16_h19_data
      - uses: actions/download-artifact@v4
        with:
          name: v88-h16-h19-config-lock
          path: .
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check --no-input numpy pandas
      - name: Run locked OOS and independent holdout
        env:
          V88_PROMPT_VERSION: "1.12.2"
          V88_PROMPT_SHA: "01d55dbe7c790ae91c8424f535e5ac68d52b9dea"
        run: |
          python - <<'PY'
          import json, os, subprocess
          cfg=json.load(open("H16_H19_CONFIG_LOCK.json"))
          if cfg.get("family_status")!="CONFIRMATORY_HYPOTHESIS_LOCKED":
              raise SystemExit("NO_LOCK")
          os.environ["HYPOTHESIS"]=cfg["selected_hypothesis"]
          subprocess.run(["python","scratch/chatgpt_v88/h16_h19/run_h16_h19_confirm.py"],check=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v88-h16-h19-confirmatory
          path: scratch/chatgpt_v88/h16_h19_data/**/results/H16_H19_CONFIRMATORY.json
          if-no-files-found: error
          retention-days: 1
