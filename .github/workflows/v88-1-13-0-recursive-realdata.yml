name: V88 1.13.0 Recursive Real-Data Canary
on:
  push:
    branches:
      - chatgpt/v88-1-13-0-recursive-realdata-20260929
permissions:
  contents: write
concurrency:
  group: v88-1-13-0-recursive-realdata
  cancel-in-progress: false
jobs:
  recursive_canary:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check --no-input pandas pyarrow numpy
      - run: python scratch/chatgpt_v88/recursive_113/recursive_canary.py
        env:
          V88_PROMPT_VERSION: "1.14.0"
          V88_PROMPT_SHA: "13bf568b1af894fbcb118090890eff466e7f1764"
      - uses: actions/upload-artifact@v4
        with:
          name: v88-1-13-recursive-canary
          path: scratch/chatgpt_v88/recursive_113
          retention-days: 7
          if-no-files-found: error
      - name: Persist evidence without retriggering
        run: |
          cp scratch/chatgpt_v88/recursive_113/V88_1_14_RECURSIVE_CANARY_SUMMARY.json research-results/edge-search/V88_1_14_RECURSIVE_CANARY_SUMMARY.json
          cp scratch/chatgpt_v88/recursive_113/PROCESS_LEARNING_1_14.json research-results/edge-search/PROCESS_LEARNING_1_14.json
          git config user.name "v88-1-13-canary"
          git config user.email "v88-1-13-canary@users.noreply.github.com"
          git add research-results/edge-search/V88_1_14_RECURSIVE_CANARY_SUMMARY.json research-results/edge-search/PROCESS_LEARNING_1_14.json
          git commit -m "V88 1.14.0: fix evidence handoff filenames [skip ci]" || true
          git push origin HEAD:$GITHUB_REF_NAME
