name: Autonomous BTC Volume Delta V2 Backtest

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: autonomous-btc-volume-delta-v2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  backtest:
    if: github.repository == 'takenthatusernameis-collab/scientific-agent-skills' && (github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'chatgpt/btc-volume-delta-v2-clean-safety')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact V2 research branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Execute real historical-data backtest
        run: |
          mkdir -p results
          python scratch/chatgpt_btc_volume_delta/optimize.py \
            --start 2024-06-01T00:00:00Z \
            --train-end 2025-12-01T00:00:00Z \
            --end 2026-09-20T00:00:00Z \
            --fee-bps 5 \
            --slippage-bps 2 \
            --stress-fee-bps 8 \
            --stress-slippage-bps 4 \
            --output results/btc_volume_delta_v2_result.json

      - name: Verify empirical completion artifact
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path

          p = Path("results/btc_volume_delta_v2_result.json")
          assert p.exists(), "missing V2 result"
          data = json.loads(p.read_text())
          assert data["protocol"]["parquet_dependency"] is False
          assert data["protocol"]["start"] == "2024-06-01T00:00:00Z"
          assert data["protocol"]["train_end"] == "2025-12-01T00:00:00Z"
          assert data["protocol"]["end"] == "2026-09-20T00:00:00Z"
          assert data["data"]["hashes"], "missing dataset hashes"
          assert not data["data"]["fetch_failures"], data["data"]["fetch_failures"]
          assert len(data["protocol"]["universe_frozen"]) >= 4
          forbidden = {"BTCUSDT","ETHUSDT","BNBUSDT","SOLUSDT","XRPUSDT"}
          assert not forbidden.intersection(data["protocol"]["universe_frozen"])
          assert data["selection"]["training_metrics"]["trades"] >= 100
          assert data["selection"]["oos_metrics"]["trades"] >= 100
          result_hash = hashlib.sha256(p.read_bytes()).hexdigest()
          manifest = {
              "status": "EMPIRICAL_BACKTEST_COMPLETED",
              "scientific_claim": "RESULTS_REQUIRE_INDEPENDENT_INTERPRETATION",
              "result_sha256": result_hash,
              "data_hashes": data["data"]["hashes"],
              "training_selection": data["selection"]["selected_parameters"],
              "training_metrics": data["selection"]["training_metrics"],
              "oos_metrics": data["selection"]["oos_metrics"],
              "stress_oos_metrics": data["selection"]["stress_oos_metrics"]
          }
          Path("results/AUTONOMOUS_BACKTEST_MANIFEST.json").write_text(json.dumps(manifest, indent=2, sort_keys=True)+"\n")
          print(json.dumps(manifest, indent=2, sort_keys=True))
          PY

      - name: Upload empirical backtest artifacts
        uses: actions/upload-artifact@v4
        with:
          name: autonomous-btc-volume-delta-v2
          path: results/
          if-no-files-found: error
          retention-days: 2
