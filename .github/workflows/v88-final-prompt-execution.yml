name: V88 Final Prompt Execution

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  execute-final-v12:
    if: >-
      github.repository == 'takenthatusernameis-collab/scientific-agent-skills' &&
      github.event.pull_request.head.ref == 'chatgpt/v88-final-prompt-execute-20260929'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout final prompt branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install execution dependencies
        run: python -m pip install --disable-pip-version-check --no-input pyyaml numpy

      - name: Execute frozen V88 v1.2.0 prompt
        run: python scratch/chatgpt_v88/final_release/execute_final_prompt.py

      - name: Upload final execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v88-final-prompt-execution
          path: scratch/chatgpt_v88/final_release/
          if-no-files-found: error
          retention-days: 1
