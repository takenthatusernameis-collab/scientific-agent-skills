name: V88 H2 BTC Volume Delta Research

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validation-screen:
    if: >-
      github.repository == 'takenthatusernameis-collab/scientific-agent-skills' &&
      github.event.pull_request.head.ref == 'chatgpt/v88-h2-volume-delta-20260929'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        z: [0.75, 1.0, 1.25]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install empirical dependencies
        run: python -m pip install --disable-pip-version-check --no-input numpy pandas vectorbt
      - name: Execute isolated H2 validation configuration
        env:
          H2_STAGE: VALIDATION
          H2_Z: ${{ matrix.z }}
          H2_H: "6"
        run: python scratch/chatgpt_v88/final_release/run_h2_delta.py
      - name: Upload H2 validation result
        uses: actions/upload-artifact@v4
        with:
          name: v88-h2-validation-Z${{ matrix.z }}
          path: scratch/chatgpt_v88/final_release/H2_RESULT_*_VALIDATION.json
          if-no-files-found: error
          retention-days: 1

  select-config:
    needs: validation-screen
    if: >-
      github.repository == 'takenthatusernameis-collab/scientific-agent-skills' &&
      github.event.pull_request.head.ref == 'chatgpt/v88-h2-volume-delta-20260929'
    runs-on: ubuntu-latest
    outputs:
      z: ${{ steps.select.outputs.z }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          pattern: v88-h2-validation-*
          path: validation-results
          merge-multiple: true
      - id: select
        name: Lock one H2 configuration from validation only
        shell: bash
        run: |
          python - <<'PY'
          import glob,json,os
          rows=[]
          for fn in glob.glob("validation-results/H2_RESULT_*_VALIDATION.json"):
              d=json.load(open(fn)); p=d["primary"]
              rows.append({"z":d["threshold_z"],"mean":p["mean"],"PF":p["PF"],"n":p["n"],"Sharpe":p["Sharpe"]})
          eligible=[x for x in rows if x["n"]>=100 and x["mean"]>0 and x["PF"]>1]
          if not eligible:
              raise SystemExit("NO_H2_VALIDATION_ELIGIBLE_CONFIGURATION")
          eligible.sort(key=lambda x:(x["mean"],x["PF"],x["Sharpe"]),reverse=True)
          winner=eligible[0]
          with open("H2_CONFIG_LOCK.json","w") as f:
              json.dump({"selected_z":winner["z"],"selection_rule":"highest validation mean net return among configs with n>=100 and PF>1","rows":rows,"winner":winner,"oos_seen":False},f,indent=2)
          with open(os.environ["GITHUB_OUTPUT"],"a") as f:
              f.write(f"z={winner['z']}\n")
      - uses: actions/upload-artifact@v4
        with:
          name: v88-h2-config-lock
          path: H2_CONFIG_LOCK.json
          if-no-files-found: error
          retention-days: 1

  confirmatory-oos:
    needs: select-config
    if: >-
      github.repository == 'takenthatusernameis-collab/scientific-agent-skills' &&
      github.event.pull_request.head.ref == 'chatgpt/v88-h2-volume-delta-20260929'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install empirical dependencies
        run: python -m pip install --disable-pip-version-check --no-input numpy pandas vectorbt
      - name: Execute locked H2 OOS configuration
        env:
          H2_STAGE: OOS
          H2_Z: ${{ needs.select-config.outputs.z }}
          H2_H: "6"
        run: python scratch/chatgpt_v88/final_release/run_h2_delta.py
      - name: Upload H2 confirmatory evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v88-h2-confirmatory-oos
          path: scratch/chatgpt_v88/final_release/H2_RESULT_*_OOS.json
          if-no-files-found: error
          retention-days: 1
