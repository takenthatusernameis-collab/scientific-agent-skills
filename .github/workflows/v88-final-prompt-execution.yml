name: V88 Continuous Empirical H1 Execution

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  execute-h1-real:
    if: >-
      github.repository == 'takenthatusernameis-collab/scientific-agent-skills' &&
      github.event.pull_request.head.ref == 'chatgpt/v88-final-prompt-execute-20260929'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout registered H1 experiment
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install real-data execution dependencies
        run: python -m pip install --disable-pip-version-check --no-input pyyaml numpy pandas vectorbt ccxt

      - name: Apply deterministic H1 archive parser patch (timestamp-safe)
        run: python scratch/chatgpt_v88/final_release/apply_h1_parser_patch.py

      - name: Execute V88 Cycle 2 H1 against real Binance data
        run: python scratch/chatgpt_v88/final_release/run_h1_real.py

      - name: Upload H1 empirical evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v88-cycle2-h1-real
          path: scratch/chatgpt_v88/final_release/
          if-no-files-found: error
          retention-days: 1
