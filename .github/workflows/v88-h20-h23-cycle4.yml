name: V88 H20-H23 Fresh 2023 Breadth Wave

on:
  push:
    branches: [main]
    paths:
      - "research-results/edge-search/V88_CYCLE4_H20_H23_MANIFEST.json"

permissions:
  contents: read

jobs:
  acquire-data:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check --no-input pandas
      - name: Acquire fresh 2023 Binance spot/perpetual/funding data
        run: python scratch/chatgpt_v88/h20_h23/acquire_2023.py
      - uses: actions/upload-artifact@v4
        with:
          name: v88-h20-h23-2023-data
          path: scratch/chatgpt_v88/h20_h23/h20_h23_data
          if-no-files-found: error
          retention-days: 1

  readiness-canary:
    needs: acquire-data
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: v88-h20-h23-2023-data
          path: scratch/chatgpt_v88/h20_h23/h20_h23_data
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check --no-input numpy pandas
      - name: Exact producer-consumer readiness canary
        run: python scratch/chatgpt_v88/h20_h23/readiness_canary.py

  validation:
    needs: readiness-canary    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        hypothesis: ["H20","H21","H22","H23"]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          name: v88-h20-h23-2023-data
          path: scratch/chatgpt_v88/h20_h23/h20_h23_data
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check --no-input numpy pandas
      - name: Execute preregistered broadened idea
        env:
          HYPOTHESIS: ${{ matrix.hypothesis }}
        run: python scratch/chatgpt_v88/h20_h23/run_h20_h23.py
      - uses: actions/upload-artifact@v4
        with:
          name: v88-h20-h23-validation-${{ matrix.hypothesis }}
          path: scratch/chatgpt_v88/h20_h23/h20_h23_data/results/${{ matrix.hypothesis }}_VALIDATION.json
          if-no-files-found: error
          retention-days: 1

  select-config:
    needs: validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: v88-h20-h23-validation-*
          path: validation-results
          merge-multiple: false
      - name: Breadth guardian validation-only lock
        run: |
          python - <<'PY'
          import glob,json
          files=sorted(glob.glob("validation-results/**/H*_VALIDATION.json",recursive=True))
          rows=[json.load(open(fn)) for fn in files]
          if len(rows)!=4: raise SystemExit(f"EXPECTED_4_GOT_{len(rows)}")
          classes={r["strategy_class"] for r in rows}
          sources={r["information_source_family"] for r in rows}
          constructions={r["position_construction"] for r in rows}
          domains={r["data_domain"] for r in rows}
          if len(classes)<3: raise SystemExit("GUARDIAN_CLASS_DIVERSITY_FAILURE")
          if len(sources)<2: raise SystemExit("GUARDIAN_SOURCE_DIVERSITY_FAILURE")
          if len(constructions)<2: raise SystemExit("GUARDIAN_CONSTRUCTION_DIVERSITY_FAILURE")
          if len(domains)<2: raise SystemExit("GUARDIAN_DOMAIN_DIVERSITY_FAILURE")
          eligible=[r for r in rows if r["validation"]["n"]>=100 and r["validation"]["mean"]>0 and r["validation"]["PF"]>1]
          summary={
            "all_validation":[
              {"hypothesis_id":r["hypothesis_id"],"strategy_class":r["strategy_class"],
               "information_source_family":r["information_source_family"],
               "position_construction":r["position_construction"],
               "data_domain":r["data_domain"],
               "validation":r["validation"]}
              for r in rows],
            "classes":sorted(classes),"information_sources":sorted(sources),
            "position_constructions":sorted(constructions),"data_domains":sorted(domains),
            "oos_seen":False,"prompt_version":"1.8.8"
          }
          if not eligible:
              summary["family_status"]="H20_H23_NO_VALIDATION_ELIGIBLE_CONFIGURATION"
              json.dump(summary,open("H20_H23_CONFIG_LOCK.json","w"),indent=2)
              raise SystemExit("NO_H20_H23_VALIDATION_ELIGIBLE")
          eligible.sort(key=lambda r:(r["validation"]["Sharpe"],r["validation"]["mean"],r["validation"]["PF"]),reverse=True)
          w=eligible[0]
          summary.update({
            "family_status":"CONFIRMATORY_HYPOTHESIS_LOCKED",
            "selected_hypothesis":w["hypothesis_id"],
            "selected_validation":w["validation"],
            "selected_strategy_class":w["strategy_class"]
          })
          json.dump(summary,open("H20_H23_CONFIG_LOCK.json","w"),indent=2)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v88-h20-h23-config-lock
          path: H20_H23_CONFIG_LOCK.json
          if-no-files-found: error
          retention-days: 1

  confirmatory:
    needs: select-config
    if: ${{ success() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          name: v88-h20-h23-2023-data
          path: scratch/chatgpt_v88/h20_h23/h20_h23_data
      - uses: actions/download-artifact@v4
        with:
          name: v88-h20-h23-config-lock
          path: .
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check --no-input numpy pandas
      - name: Run locked OOS and independent holdout
        run: |
          python - <<'PY'
          import json, os, subprocess
          cfg=json.load(open("H20_H23_CONFIG_LOCK.json"))
          if cfg.get("family_status")!="CONFIRMATORY_HYPOTHESIS_LOCKED":
              raise SystemExit("NO_LOCK")
          os.environ["HYPOTHESIS"]=cfg["selected_hypothesis"]
          subprocess.run(["python","scratch/chatgpt_v88/h20_h23/run_h20_h23_confirm.py"],check=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v88-h20-h23-confirmatory
          path: scratch/chatgpt_v88/h20_h23/h20_h23_data/results/H20_H23_CONFIRMATORY.json
          if-no-files-found: error
          retention-days: 1
