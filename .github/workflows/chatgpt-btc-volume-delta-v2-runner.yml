name: ChatGPT BTC Volume Delta V2 Ephemeral

on:
  push:
    branches:
      - chatgpt/btc-volume-delta-v2-clean-safety

permissions:
  contents: read

concurrency:
  group: chatgpt-btc-volume-delta-v2-ephemeral
  cancel-in-progress: true

jobs:
  optimize:
    if: github.repository == 'takenthatusernameis-collab/scientific-agent-skills'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout only the disposable research payload
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            scratch/chatgpt_btc_volume_delta
          sparse-checkout-cone-mode: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run controlled OOS optimization
        run: |
          mkdir -p results
          python scratch/chatgpt_btc_volume_delta/optimize.py \
            --start 2024-06-01T00:00:00Z \
            --train-end 2025-12-01T00:00:00Z \
            --end 2026-09-20T00:00:00Z \
            --fee-bps 5 \
            --slippage-bps 2 \
            --stress-fee-bps 8 \
            --stress-slippage-bps 4 \
            --output results/btc_volume_delta_v2_result.json

      - name: Upload research artifacts (1-day retention)
        uses: actions/upload-artifact@v4
        with:
          name: btc-volume-delta-v2-result
          path: results/
          if-no-files-found: error
          retention-days: 1
