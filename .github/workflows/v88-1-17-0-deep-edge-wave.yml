name: V88 1.17 Deep-Edge Frontier Pilot

on:
  push:
    branches:
      - chatgpt/v88-1-17-0-deep-edge-wave-20260929
    paths:
      - research-results/edge-search/V88_CYCLE6_TRIGGER.json
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - research-results/edge-search/V88_CYCLE6_TRIGGER.json

permissions:
  contents: write
  actions: read

concurrency:
  group: v88-cycle6-h16-h19-frontier
  cancel-in-progress: false

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check --no-input pandas numpy pyarrow
      - name: Acquire immutable Binance Vision package
        run: python scratch/chatgpt_v88/h16_h19_frontier/acquire_2023_vision.py
      - uses: actions/upload-artifact@v4
        with:
          name: v88-cycle6-data
          path: scratch/chatgpt_v88/h16_h19_frontier/data
          retention-days: 2
          if-no-files-found: error

  validation:
    needs: acquire
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        hypothesis:
          - H16_1H_FUNDING_CARRY_CONTRARIAN
          - H17_1H_LIQUIDITY_SHOCK_REVERSAL
          - H18_1H_WEEKEND_CALENDAR_REVERSAL
          - H19_1H_VOLATILITY_STATE_CONTINUATION
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          name: v88-cycle6-data
          path: scratch/chatgpt_v88/h16_h19_frontier/data
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check --no-input pandas numpy
      - name: Run fresh validation
        env:
          HYPOTHESIS: ${{ matrix.hypothesis }}
          PHASE: validation
        run: python scratch/chatgpt_v88/h16_h19_frontier/run_cycle6.py
      - uses: actions/upload-artifact@v4
        with:
          name: v88-cycle6-validation-${{ matrix.hypothesis }}
          path: scratch/chatgpt_v88/h16_h19_frontier/results/${{ matrix.hypothesis }}_VALIDATION.json
          retention-days: 2
          if-no-files-found: error

  select:
    needs: validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: v88-cycle6-validation-*
          path: cycle6-validation
          merge-multiple: true
      - name: Apply preregistered validation-only selector
        run: |
          python - <<'PY'
          import glob,json,pathlib
          files=sorted(glob.glob("cycle6-validation/*_VALIDATION.json"))
          if len(files)!=4: raise SystemExit(f"EXPECTED_4_RESULTS_GOT_{len(files)}")
          rows=[json.load(open(f)) for f in files]
          eligible=[r for r in rows if (r["stats"]["n"] or 0)>=100 and (r["stats"]["mean"] or -1)>0 and (r["stats"]["PF"] or 0)>1 and (r["stats"]["Sharpe"] or -99)>=0.5]
          out={"experiment_id":"V88-CYCLE6-H16-H19-1H-FRESH-R2-20260929","validation_results":rows,"oos_seen":False,"holdout_seen":False,"selection_firewall":True}
          if not eligible:
              out["selection_status"]="NO_VALIDATION_ELIGIBLE"
          else:
              eligible.sort(key=lambda r:(r["stats"]["Sharpe"],r["stats"]["mean"],r["stats"]["PF"],r["hypothesis_id"]),reverse=True)
              out["selection_status"]="LOCKED_ONE_FOR_CONFIRMATION"; out["selected_hypothesis"]=eligible[0]["hypothesis_id"]; out["selected_validation"]=eligible[0]["stats"]
          pathlib.Path("cycle6-selection.json").write_text(json.dumps(out,indent=2)+"\n")
          print(json.dumps(out,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v88-cycle6-selection
          path: cycle6-selection.json
          retention-days: 2
          if-no-files-found: error

  oos:
    needs: select
    runs-on: ubuntu-latest
    if: ${{ always() && needs.select.result == 'success' }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: v88-cycle6-selection
      - name: Stop cleanly when validation has no eligible candidate
        run: |
          python - <<'PY'
          import json
          if json.load(open("cycle6-selection.json")).get("selection_status")=="NO_VALIDATION_ELIGIBLE":
              print("NO_OOS_AUTHORIZED")
              raise SystemExit(0)
          PY
      - uses: actions/download-artifact@v4
        with:
          name: v88-cycle6-data
          path: scratch/chatgpt_v88/h16_h19_frontier/data
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check --no-input pandas numpy
      - name: Run locked OOS only
        run: |
          HYP=$(python -c 'import json; print(json.load(open("cycle6-selection.json"))["selected_hypothesis"])')
          HYPOTHESIS="$HYP" PHASE=oos python scratch/chatgpt_v88/h16_h19_frontier/run_cycle6.py
      - uses: actions/upload-artifact@v4
        with:
          name: v88-cycle6-oos
          path: scratch/chatgpt_v88/h16_h19_frontier/results/*_OOS.json
          retention-days: 2
          if-no-files-found: error

  holdout:
    needs: [select,oos]
    runs-on: ubuntu-latest
    if: ${{ always() && needs.select.result == 'success' && needs.oos.result == 'success' }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: v88-cycle6-selection
      - uses: actions/download-artifact@v4
        with:
          name: v88-cycle6-oos
      - name: Gate holdout behind the frozen OOS criterion
        run: |
          python - <<'PY'
          import glob,json
          sel=json.load(open("cycle6-selection.json"))
          if sel.get("selection_status")=="NO_VALIDATION_ELIGIBLE": raise SystemExit(0)
          f=glob.glob("*_OOS.json")
          if len(f)!=1: raise SystemExit(f"EXPECTED_1_OOS_GOT_{len(f)}")
          s=json.load(open(f[0]))["stats"]
          gate=(s.get("n") or 0)>=100 and (s.get("mean") or -1)>0 and (s.get("PF") or 0)>1 and (s.get("Sharpe") or -99)>=0.9
          if not gate:
              pathlib=None
              open("HOLDOUT_NOT_AUTHORIZED.txt","w").write("OOS gate failed; holdout not run.\n")
              raise SystemExit(0)
          PY
      - uses: actions/download-artifact@v4
        with:
          name: v88-cycle6-data
          path: scratch/chatgpt_v88/h16_h19_frontier/data
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check --no-input pandas numpy
      - name: Run locked holdout only
        run: |
          HYP=$(python -c 'import json; print(json.load(open("cycle6-selection.json"))["selected_hypothesis"])')
          HYPOTHESIS="$HYP" PHASE=holdout python scratch/chatgpt_v88/h16_h19_frontier/run_cycle6.py
      - uses: actions/upload-artifact@v4
        with:
          name: v88-cycle6-holdout
          path: scratch/chatgpt_v88/h16_h19_frontier/results/*_HOLDOUT.json
          retention-days: 2
          if-no-files-found: error

  persist:
    needs: [validation,select,oos,holdout]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v4
        with:
          pattern: v88-cycle6-*
          path: artifacts
          merge-multiple: false
      - name: Build durable cycle summary
        run: |
          python - <<'PY'
          import glob,json,pathlib
          root=pathlib.Path("artifacts")
          files=sorted(root.rglob("*.json"))
          out={"experiment_id":"V88-CYCLE6-H16-H19-1H-FRESH-20260929","source_commit":"${{ github.sha }}","artifacts":[str(p) for p in files]}
          pathlib.Path("research-results/edge-search/V88_CYCLE6_SUMMARY.json").write_text(json.dumps(out,indent=2)+"\n")
          PY
      - name: Persist summary on research branch
        run: |
          git config user.name "v88-cycle6"
          git config user.email "v88-cycle6@users.noreply.github.com"
          git add research-results/edge-search/V88_CYCLE6_SUMMARY.json
          git commit -m "V88 Cycle6: persist frontier pilot summary" || exit 0
          git push origin HEAD:${GITHUB_REF_NAME}
