name: ChatGPT Research Run Cleanup

on:
  workflow_run:
    workflows:
      - "ChatGPT BTC Volume Delta V2 Ephemeral"
    types: [completed]

permissions:
  actions: write

jobs:
  cleanup:
    if: >-
      github.event.workflow_run.conclusion != 'skipped' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      startsWith(github.event.workflow_run.head_branch, 'chatgpt/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete completed research run
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          curl --fail --silent --show-error --request DELETE \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}"
