name: V88 H5-H8 Intraday Hypothesis Wave

on:
  push:
    branches: ["chatgpt/v88-h5-h8-intraday-20260929"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validation-screen:
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        hypothesis: ["H5","H6","H7","H8"]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          name: v88-h3-data
          path: scratch/chatgpt_v88/h5_h8_intraday/h5_data
          repository: ${{ github.repository }}
          run-id: 36507336807
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check --no-input numpy pandas
      - name: Run isolated fresh-validation hypothesis
        env:
          HYPOTHESIS: ${{ matrix.hypothesis }}
        run: python scratch/chatgpt_v88/h5_h8_intraday/run_intraday_hypothesis.py
      - uses: actions/upload-artifact@v4
        with:
          name: v88-h5-h8-validation-${{ matrix.hypothesis }}
          path: scratch/chatgpt_v88/h5_h8_intraday/h5_data/results/${{ matrix.hypothesis }}_VALIDATION.json
          if-no-files-found: error
          retention-days: 1

  select-config:
    needs: validation-screen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: v88-h5-h8-validation-*
          path: validation-results
          merge-multiple: true
      - name: Lock one preregistered hypothesis from fresh validation only
        run: |
          python - <<'PY'
          import glob,json
          rows=[json.load(open(fn)) for fn in glob.glob("validation-results/*_VALIDATION.json")]
          eligible=[r for r in rows if r["validation"]["n"]>=100 and r["validation"]["mean"]>0 and r["validation"]["PF"]>1]
          summary={"all_validation":[{"hypothesis_id":r["hypothesis_id"],"hypothesis":r["hypothesis"],"validation":r["validation"]} for r in rows],"oos_seen":False}
          if not eligible:
              summary["family_status"]="H5_H8_NO_VALIDATION_ELIGIBLE_CONFIGURATION"
              json.dump(summary,open("H5_H8_CONFIG_LOCK.json","w"),indent=2)
              print(json.dumps(summary,indent=2))
              raise SystemExit("NO_H5_H8_VALIDATION_ELIGIBLE_CONFIGURATION")
          eligible.sort(key=lambda r:(r["validation"]["Sharpe"],r["validation"]["mean"],r["validation"]["PF"]),reverse=True)
          w=eligible[0]
          summary.update({
            "family_status":"CONFIRMATORY_HYPOTHESIS_LOCKED",
            "selected_hypothesis":w["hypothesis_id"],
            "selected_validation":w["validation"],
            "selection_rule":"highest fresh-validation Sharpe among preregistered hypotheses with n>=100, positive mean, PF>1"
          })
          json.dump(summary,open("H5_H8_CONFIG_LOCK.json","w"),indent=2)
          print(json.dumps(summary,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v88-h5-h8-config-lock
          path: H5_H8_CONFIG_LOCK.json
          if-no-files-found: error
          retention-days: 1

  confirmatory:
    needs: select-config
    if: ${{ success() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          name: v88-h3-data
          path: scratch/chatgpt_v88/h5_h8_intraday/h5_data
          repository: ${{ github.repository }}
          run-id: 36507336807
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          name: v88-h5-h8-config-lock
          path: .
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check --no-input numpy pandas
      - name: Run frozen OOS and independent holdout
        run: |
          python - <<'PY'
          import json, os, subprocess
          cfg=json.load(open("H5_H8_CONFIG_LOCK.json"))
          if cfg.get("family_status")!="CONFIRMATORY_HYPOTHESIS_LOCKED":
              raise SystemExit("NO_CONFIRMATORY_LOCK")
          os.environ["HYPOTHESIS"]=cfg["selected_hypothesis"]
          subprocess.run(["python","scratch/chatgpt_v88/h5_h8_intraday/confirm_intraday.py"],check=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v88-h5-h8-confirmatory
          path: scratch/chatgpt_v88/h5_h8_intraday/h5_data/results/H5_H8_CONFIRMATORY.json
          if-no-files-found: error
          retention-days: 1
