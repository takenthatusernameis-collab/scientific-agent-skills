name: ChatGPT BTC Volume Delta Research Runner

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run non-Parquet backtest
        run: |
          mkdir -p results
          python scratch/chatgpt_btc_volume_delta/backtest.py             --start 2024-06-01T00:00:00Z             --end 2026-09-20T00:00:00Z             --lookback 48             --threshold 2.0             --hold-bars 6             --fee-bps 5             --slippage-bps 2             --output results/btc_volume_delta_result.json

      - name: Upload research artifacts
        uses: actions/upload-artifact@v4
        with:
          name: btc-volume-delta-result
          path: results/
          if-no-files-found: error
