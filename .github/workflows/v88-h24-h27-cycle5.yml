name: V88 H24-H27 Fresh 2023 Validation Wave

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  acquire-data:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check --no-input pandas pyarrow binance-vision
      - name: Acquire exact real-data validation package
        run: python scratch/chatgpt_v88/h24_h27/acquire_2023.py
      - uses: actions/upload-artifact@v4
        with:
          name: v88-h24-h27-data
          path: scratch/chatgpt_v88/h24_h27/data
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: v88-h24-h27-manifest
          path: scratch/chatgpt_v88/h24_h27/DATA_MANIFEST.json
          if-no-files-found: error
          retention-days: 1

  validation:
    needs: acquire-data
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        hypothesis: ["H24","H25","H26","H27"]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check --no-input pandas pyarrow numpy
      - uses: actions/download-artifact@v4
        with:
          name: v88-h24-h27-data
          path: scratch/chatgpt_v88/h24_h27/data
      - uses: actions/download-artifact@v4
        with:
          name: v88-h24-h27-manifest
          path: scratch/chatgpt_v88/h24_h27
      - name: Execute one preregistered validation worker
        env:
          HYPOTHESIS: ${{ matrix.hypothesis }}
        run: python scratch/chatgpt_v88/h24_h27/run_h24_h27.py
      - uses: actions/upload-artifact@v4
        with:
          name: v88-h24-h27-validation-${{ matrix.hypothesis }}
          path: scratch/chatgpt_v88/h24_h27/data/results/H${{ matrix.hypothesis }}_VALIDATION.json
          if-no-files-found: error
          retention-days: 1

  summarize:
    needs: validation
    runs-on: ubuntu-latest
    if: always()
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: v88-h24-h27-validation-*
          path: validation-results
          merge-multiple: false
      - name: Build validation summary and historian handoff
        run: |
          python - <<'PY'
          import glob,json,pathlib
          files=sorted(glob.glob("validation-results/**/H*_VALIDATION.json",recursive=True))
          rows=[json.load(open(f)) for f in files]
          out={"experiment_id":"V88-CYCLE5-H24-H27","prompt_version":"1.9.5","validation_results":rows,"oos_seen":False,"holdout_seen":False,"selection_firewall":"No OOS promotion in this wave."}
          pathlib.Path("summary.json").write_text(json.dumps(out,indent=2)+"\n")
          print(json.dumps(out,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v88-h24-h27-validation-summary
          path: summary.json
          if-no-files-found: error
          retention-days: 1
      - uses: actions/checkout@v4
        with:
          path: persist
      - run: |
          mkdir -p persist/research-results/edge-search
          cp summary.json persist/research-results/edge-search/V88_CYCLE5_H24_H27_VALIDATION_SUMMARY.json
      - name: Persist validation summary
        working-directory: persist
        run: |
          git config user.name "v88-cycle5"
          git config user.email "v88-cycle5@users.noreply.github.com"
          git add research-results/edge-search/V88_CYCLE5_H24_H27_VALIDATION_SUMMARY.json
          git commit -m "V88 Cycle5: persist H24-H27 validation summary" || exit 0
          git push origin HEAD:main
