name: V88 H24-H27 Fresh 2023 Validation Wave

on:
  push:
    branches: [main]

concurrency:
  group: v88-cycle5-h24-h27
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  acquire-data:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check --no-input pandas pyarrow binance-vision
      - name: Acquire exact real-data validation package
        run: python scratch/chatgpt_v88/h24_h27/acquire_2023.py
      - name: Execution readiness canary
        run: |
          python - <<'PY'
          import hashlib, json, pathlib
          import pandas as pd
          root=pathlib.Path("scratch/chatgpt_v88/h24_h27")
          data=root/"data"
          required = {
            "metrics": [f"{s}_metrics.parquet" for s in ["BTCUSDT","ETHUSDT","SOLUSDT","DOGEUSDT","INJUSDT","OPUSDT","STXUSDT","LINKUSDT"]],
            "bookDepth": [f"{s}_bookDepth.parquet" for s in ["BTCUSDT","ETHUSDT"]],
            "klines": [f"{s}_klines_1h.parquet" for s in ["BTCUSDT","ETHUSDT","SOLUSDT","DOGEUSDT","INJUSDT","OPUSDT","STXUSDT","LINKUSDT"]]
          }
          observed=[]
          for family, names in required.items():
            for name in names:
              p=data/name
              if not p.exists():
                raise SystemExit(f"INFRASTRUCTURE_FAILURE: missing required artifact {p}")
              df=pd.read_parquet(p)
              if len(df)==0:
                raise SystemExit(f"INFRASTRUCTURE_FAILURE: empty required artifact {p}")
              if family=="metrics" and "create_time" not in df.columns:
                raise SystemExit(f"INFRASTRUCTURE_FAILURE: metrics schema mismatch {p}")
              if family=="bookDepth" and not {"timestamp","percentage","depth","notional"}.issubset(df.columns):
                raise SystemExit(f"INFRASTRUCTURE_FAILURE: bookDepth schema mismatch {p}")
              if family=="klines" and not {"open_time","open"}.issubset(df.columns):
                raise SystemExit(f"INFRASTRUCTURE_FAILURE: klines schema mismatch {p}")
              observed.append({"family":family,"file":name,"rows":int(len(df)),"columns":list(df.columns)})
          manifest=root/"DATA_MANIFEST.json"
          manifest_sha=hashlib.sha256(manifest.read_bytes()).hexdigest()
          report={"experiment_id":"V88-CYCLE5-H24-H27","prompt_version":"1.9.6","prompt_sha":"8a8cb933efa45236916cc8a3989e097e0de3856b","artifact_digest":manifest_sha,"expected_artifact_count":18,"observed_artifact_count":len(observed),"families":sorted(required),"loader_readiness":"PASS"}
          (root/"READINESS_CANARY.json").write_text(json.dumps(report,indent=2)+"\n")
          print(json.dumps(report,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v88-h24-h27-readiness-canary
          path: scratch/chatgpt_v88/h24_h27/READINESS_CANARY.json
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: v88-h24-h27-data
          path: scratch/chatgpt_v88/h24_h27/data
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: v88-h24-h27-manifest
          path: scratch/chatgpt_v88/h24_h27/DATA_MANIFEST.json
          if-no-files-found: error
          retention-days: 1

  validation:
    needs: acquire-data
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        hypothesis: ["H24","H25","H26","H27"]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check --no-input pandas pyarrow numpy
      - uses: actions/download-artifact@v4
        with:
          name: v88-h24-h27-data
          path: scratch/chatgpt_v88/h24_h27/data
      - uses: actions/download-artifact@v4
        with:
          name: v88-h24-h27-manifest
          path: scratch/chatgpt_v88/h24_h27
      - name: Execute one preregistered validation worker
        env:
          HYPOTHESIS: ${{ matrix.hypothesis }}
          V88_PROMPT_VERSION: "1.9.6"
          V88_PROMPT_SHA: "8a8cb933efa45236916cc8a3989e097e0de3856b"
        run: python scratch/chatgpt_v88/h24_h27/run_h24_h27.py
      - uses: actions/upload-artifact@v4
        with:
          name: v88-h24-h27-validation-${{ matrix.hypothesis }}
          path: scratch/chatgpt_v88/h24_h27/data/results/${{ matrix.hypothesis }}_VALIDATION.json
          if-no-files-found: error
          retention-days: 1

  summarize:
    needs: validation
    runs-on: ubuntu-latest
    if: always()
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: v88-h24-h27-validation-*
          path: validation-results
          merge-multiple: false
      - name: Build validation summary and historian handoff
        run: |
          python - <<'PY'
          import glob,json,pathlib
          expected={f"{h}_VALIDATION.json" for h in ["H24","H25","H26","H27"]}
          files=sorted(glob.glob("validation-results/**/H*_VALIDATION.json",recursive=True))
          found={pathlib.Path(f).name for f in files}
          if found != expected:
            raise SystemExit(f"INFRASTRUCTURE_FAILURE: expected {sorted(expected)}, found {sorted(found)}")
          rows=[json.load(open(f)) for f in files]
          if any(r.get("status") != "VALIDATION_COMPLETE" for r in rows):
            raise SystemExit("INFRASTRUCTURE_FAILURE: at least one worker did not reach VALIDATION_COMPLETE")
          out={"experiment_id":"V88-CYCLE5-H24-H27","prompt_version":"1.9.6","validation_results":rows,"oos_seen":False,"holdout_seen":False,"selection_firewall":"No OOS promotion in this wave."}
          pathlib.Path("summary.json").write_text(json.dumps(out,indent=2)+"\n")
          print(json.dumps(out,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v88-h24-h27-validation-summary
          path: summary.json
          if-no-files-found: error
          retention-days: 1
      - uses: actions/checkout@v4
        with:
          path: persist
      - run: |
          git fetch origin main
          git reset --hard origin/main
          mkdir -p persist/research-results/edge-search
          cp summary.json persist/research-results/edge-search/V88_CYCLE5_H24_H27_VALIDATION_SUMMARY.json
      - name: Persist validation summary
        working-directory: persist
        run: |
          git config user.name "v88-cycle5"
          git config user.email "v88-cycle5@users.noreply.github.com"
          git add research-results/edge-search/V88_CYCLE5_H24_H27_VALIDATION_SUMMARY.json
          git commit -m "V88 Cycle5: persist H24-H27 validation summary"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
          git fetch origin main
          local_sha=$(sha256sum research-results/edge-search/V88_CYCLE5_H24_H27_VALIDATION_SUMMARY.json | cut -d" " -f1)
          remote_sha=$(git show origin/main:research-results/edge-search/V88_CYCLE5_H24_H27_VALIDATION_SUMMARY.json | sha256sum | cut -d" " -f1)
          test "$local_sha" = "$remote_sha"
