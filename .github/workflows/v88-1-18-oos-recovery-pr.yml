name: V88 OOS Recovery From Frozen Robustness Artifacts

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  actions: read

concurrency:
  group: v88-1-18-oos-recovery
  cancel-in-progress: true

env:
  SOURCE_REPO: takenthatusernameis-collab/scientific-agent-skills
  SOURCE_RUN_ID: "36539347437"
  INPUT_ARTIFACT_ID: "11019369619"
  FEATURE_ARTIFACT_ID: "11020306049"
  ROBUSTNESS_ARTIFACT_IDS: "11020256076,11019684775,11020610357,11020705001,11019868914,11020171143,11019534946,11020385829,11019844259,11019966834,11020690148,11019749545,11020725014,11020311077,11019744631,11019819260"

jobs:
  repair_freeze_stage2:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: e017def380f7aa536b1eb574b483a1afd3c72e10
          fetch-depth: 1
          sparse-checkout: |
            requirements-v88-deep-edge-118.txt
            scratch/chatgpt_v88/deep_edge_117
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check --no-input -r requirements-v88-deep-edge-118.txt
      - name: Download exact frozen inputs
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ env.SOURCE_REPO }}
          run-id: ${{ env.SOURCE_RUN_ID }}
          artifact-ids: ${{ env.INPUT_ARTIFACT_ID }}
          path: scratch/chatgpt_v88/deep_edge_117/input_artifact
      - name: Download exact frozen features
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ env.SOURCE_REPO }}
          run-id: ${{ env.SOURCE_RUN_ID }}
          artifact-ids: ${{ env.FEATURE_ARTIFACT_ID }}
          path: scratch/chatgpt_v88/deep_edge_117/features
      - name: Download all exact robustness shards
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ env.SOURCE_REPO }}
          run-id: ${{ env.SOURCE_RUN_ID }}
          artifact-ids: ${{ env.ROBUSTNESS_ARTIFACT_IDS }}
          path: scratch/chatgpt_v88/deep_edge_117/robustness_artifacts
          merge-multiple: true
      - name: Normalize immutable inputs
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import re
          import shutil
          from pathlib import Path

          r=Path("scratch/chatgpt_v88/deep_edge_117")
          inputs=r/"inputs"
          inputs.mkdir(parents=True,exist_ok=True)

          def one_file(root, name, dest):
              hits=sorted(Path(root).rglob(name))
              if len(hits)!=1:
                  raise SystemExit(f"EXPECTED_EXACTLY_ONE:{name}:{len(hits)}:"+str(hits[:10]))
              shutil.copy2(hits[0], inputs/dest)

          root=r/"input_artifact"
          for name in ["DATA_MANIFEST.json","WAVE_MANIFEST.json","candidate_matrix.json","stage1_matrix.json"]:
              one_file(root,name,name)

          feature_hits=sorted((r/"features").rglob("FEATURES.parquet"))
          if len(feature_hits)!=1:
              raise SystemExit(f"EXPECTED_EXACTLY_ONE:FEATURES.parquet:{len(feature_hits)}:"+str(feature_hits[:10]))

          robust_root=r/"robustness_artifacts"
          shard_hits=sorted(robust_root.rglob("shard_*.json"))
          print("ROBUSTNESS_SHARD_FILES", [str(x) for x in shard_hits])
          by_sid={}
          for p in shard_hits:
              m=re.search(r"shard_(\d+)\.json$",p.name)
              if not m:
                  continue
              sid=int(m.group(1))
              if sid in by_sid:
                  raise SystemExit(f"DUPLICATE_SHARD_ID:{sid}:{by_sid[sid]}:{p}")
              by_sid[sid]=p
          if set(by_sid)!=set(range(16)):
              raise SystemExit(f"EXPECTED_SHARD_IDS_0_TO_15:found={sorted(by_sid)}")
          robust=r/"robustness"
          if robust.exists():
              shutil.rmtree(robust)
          robust.mkdir(parents=True)
          for sid,p in sorted(by_sid.items()):
              shutil.copy2(p, robust/f"shard_{sid}.json")
          shutil.copy2(feature_hits[0], r/"features/FEATURES.parquet")
          print("NORMALIZATION_PASS", {"robustness_shards":len(by_sid)})
          PY
      - name: Verify frozen identity and reduce robustness
        run: |
          set -euo pipefail
          python scratch/chatgpt_v88/deep_edge_117/robustness_reduce.py
          python - <<'PY'
          import json
          from pathlib import Path
          r=Path("scratch/chatgpt_v88/deep_edge_117")
          w=json.loads((r/"inputs/WAVE_MANIFEST.json").read_text())
          f=json.loads((r/"freeze_stage2.json").read_text())
          assert w["prompt_version"]=="1.18.9"
          assert w["candidate_count"]==4096
          assert w["holdout_selection_forbidden"] is True
          assert f["input_count"]==43
          assert f["pass_count"]==3
          assert len(f["oos_candidates"])==3
          print(json.dumps({"status":"PASS","robustness_input_count":f["input_count"],"robustness_pass_count":f["pass_count"],"oos_candidates":len(f["oos_candidates"])}))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v88-1-18-freeze2-repaired
          path: scratch/chatgpt_v88/deep_edge_117/freeze_stage2.json
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: v88-1-18-audit-inputs-repaired
          path: scratch/chatgpt_v88/deep_edge_117/inputs
          retention-days: 14
          if-no-files-found: error

  oos:
    needs: repair_freeze_stage2
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard_id: [0,1,2,3,4,5,6,7]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: e017def380f7aa536b1eb574b483a1afd3c72e10
          fetch-depth: 1
          sparse-checkout: |
            requirements-v88-deep-edge-118.txt
            scratch/chatgpt_v88/deep_edge_117
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check --no-input -r requirements-v88-deep-edge-118.txt
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          name: v88-1-18-features
          repository: ${{ env.SOURCE_REPO }}
          run-id: ${{ env.SOURCE_RUN_ID }}
          path: scratch/chatgpt_v88/deep_edge_117/features
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          artifact-ids: ${{ env.INPUT_ARTIFACT_ID }}
          repository: ${{ env.SOURCE_REPO }}
          run-id: ${{ env.SOURCE_RUN_ID }}
          path: scratch/chatgpt_v88/deep_edge_117/source_inputs
      - uses: actions/download-artifact@v4
        with:
          name: v88-1-18-freeze2-repaired
          path: scratch/chatgpt_v88/deep_edge_117
      - name: Run exact preregistered OOS worker
        run: python scratch/chatgpt_v88/deep_edge_117/oos_worker.py
        env:
          SHARD_ID: ${{ matrix.shard_id }}
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: v88-1-18-oos-repaired-${{ matrix.shard_id }}
          path: scratch/chatgpt_v88/deep_edge_117/oos/shard_${{ matrix.shard_id }}.json
          retention-days: 14
          if-no-files-found: error

  oos_reduce:
    needs: oos
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: e017def380f7aa536b1eb574b483a1afd3c72e10
          fetch-depth: 1
          sparse-checkout: |
            requirements-v88-deep-edge-118.txt
            scratch/chatgpt_v88/deep_edge_117
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check --no-input -r requirements-v88-deep-edge-118.txt
      - uses: actions/download-artifact@v4
        with:
          pattern: v88-1-18-oos-repaired-*
          path: scratch/chatgpt_v88/deep_edge_117/oos
          merge-multiple: true
      - name: Reduce repaired OOS evidence
        run: |
          set -euo pipefail
          python scratch/chatgpt_v88/deep_edge_117/oos_reduce.py
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("scratch/chatgpt_v88/deep_edge_117/freeze_oos.json")
          x=json.loads(p.read_text())
          assert x["input_count"]==3
          assert x["holdout_seen"] is False
          print(json.dumps({"status":"PASS","oos_input_count":x["input_count"],"oos_pass_count":x["pass_count"],"holdout_candidates":len(x["holdout_candidates"])}))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v88-1-18-freeze-oos-repaired
          path: scratch/chatgpt_v88/deep_edge_117/freeze_oos.json
          retention-days: 14
          if-no-files-found: error
