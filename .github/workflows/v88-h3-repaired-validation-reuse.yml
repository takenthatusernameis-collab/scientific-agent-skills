name: V88 H3 Repaired Validation Reuse

on:
  push:
    branches: ["chatgpt/v88-h3-afterhours-20260929"]

permissions:
  contents: read

jobs:
  reuse-verified-data:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.head_sha }}
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          name: v88-h3-data
          path: scratch/chatgpt_v88/final_release/
          repository: ${{ github.repository }}
          run-id: 36507336807
          github-token: ${{ secrets.GITHUB_TOKEN }}
  validation-screen:
    needs: reuse-verified-data
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        beta: [20,40,60]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.head_sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: v88-h3-data
          path: scratch/chatgpt_v88/final_release/
      - run: python -m pip install --disable-pip-version-check --no-input numpy pandas
      - name: Run isolated H3 validation configuration
        env:
          H3_BETA: ${{ matrix.beta }}
        run: python scratch/chatgpt_v88/final_release/run_h3_afterhours.py
      - uses: actions/upload-artifact@v4
        with:
          name: v88-h3-validation-B${{ matrix.beta }}
          path: scratch/chatgpt_v88/final_release/H3_VALIDATION_B${{ matrix.beta }}.json
          if-no-files-found: error
          retention-days: 1

  select-config:
    needs: validation-screen
    runs-on: ubuntu-latest
    outputs:
      beta: ${{ steps.select.outputs.beta }}
      threshold: ${{ steps.select.outputs.threshold }}
      nq: ${{ steps.select.outputs.nq }}
      exit: ${{ steps.select.outputs.exit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          pattern: v88-h3-validation-*
          path: validation-results
          merge-multiple: true
      - id: select
        name: Lock one H3 configuration from validation only
        shell: bash
        run: |
          python - <<'PY'
          import glob,json,os
          rows=[json.load(open(fn)) for fn in glob.glob("validation-results/H3_VALIDATION_B*.json")]
          eligible=[r for r in rows if r["validation"]["n"]>=100 and r["validation"]["mean"]>0 and r["validation"]["PF"]>1]
          if not eligible:
              raise SystemExit("NO_H3_VALIDATION_ELIGIBLE_CONFIGURATION")
          eligible.sort(key=lambda r:(r["validation"]["Sharpe"],r["validation"]["mean"],r["validation"]["PF"]),reverse=True)
          winner=eligible[0]
          cfg=winner["selected_config"]
          json.dump({"selection_rule":"highest validation Sharpe among configs with n>=100, positive mean, PF>1","selected_config":cfg,"winner":winner["validation"],"all_validation":[r["validation"] for r in rows],"oos_seen":False},open("H3_CONFIG_LOCK.json","w"),indent=2)
          with open(os.environ["GITHUB_OUTPUT"],"a") as out:
              out.write(f"beta={cfg['beta_window']}\nthreshold={cfg['shock_threshold']}\nnq={cfg['n_quantiles']}\nexit={cfg['exit']}\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v88-h3-config-lock
          path: H3_CONFIG_LOCK.json
          if-no-files-found: error
          retention-days: 1

  confirmatory:
    needs: select-config
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: v88-h3-data
          path: scratch/chatgpt_v88/final_release/
      - run: python -m pip install --disable-pip-version-check --no-input numpy pandas
      - name: Run frozen H3 OOS and holdout
        env:
          H3_BETA: ${{ needs.select-config.outputs.beta }}
          H3_THRESHOLD: ${{ needs.select-config.outputs.threshold }}
          H3_NQ: ${{ needs.select-config.outputs.nq }}
          H3_EXIT: ${{ needs.select-config.outputs.exit }}
        run: python scratch/chatgpt_v88/final_release/confirm_h3.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v88-h3-confirmatory
          path: scratch/chatgpt_v88/final_release/H3_CONFIRMATORY.json
          if-no-files-found: error
          retention-days: 1
